<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Alex的遊戲世界</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* VOICE: 一台放了兩卡匣的掌上遊戲機，打開就想玩
   IDEA: 遊戲卡匣架：每款遊戲是一張大卡匣，封面用遊戲本身的角色
   PICTURE: 兩張卡匣封面（蜂蜜黃喵喵、冰雪藍小鎮），各自擺上 ChatGPT 角色
   COLOUR and TYPE: 深夜藍底、卡匣各用自己遊戲的主色；Noto Sans TC 900
   LAYOUT: 標題 → 兩張卡匣（手機上下、桌機左右）→ 進度與開始鈕 */
:root{--night:#1c2340;--ink:#fff;--honey:#ffcf3d;--ice:#cfe6f7;--green:#3fbf4f}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font:16px/1.5 "Noto Sans TC","PingFang TC",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{overflow-x:clip}
#lobby{min-height:100dvh;padding:calc(env(safe-area-inset-top) + 24px) max(5vw,16px) calc(env(safe-area-inset-bottom) + 28px);background:radial-gradient(120% 70% at 50% 0%,#33407a,var(--night) 70%)}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:clamp(34px,7vw,52px);line-height:1.05;margin:0 0 6px;font-weight:900;letter-spacing:.02em;text-wrap:balance}
.sub{margin:0 0 22px;color:#b9c3e8;font-weight:700}
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
.cart{position:relative;border:0;padding:0;text-align:left;cursor:pointer;border-radius:26px;overflow:hidden;color:#2a1a08;box-shadow:0 10px 0 rgba(0,0,0,.35);transition:transform .15s}
.cart:active{transform:translateY(4px)}
.cart:focus-visible{outline:4px solid #fff;outline-offset:3px}
.cover{position:relative;height:250px;overflow:hidden}
.cover .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.cover img{position:absolute;bottom:14px}
.info{padding:16px 18px 18px;display:grid;gap:6px}
.info b{font-size:26px;line-height:1.1;font-weight:900}
.info p{margin:0;font-size:15px;font-weight:700;opacity:.8}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.prog{font-weight:900;font-size:14px}
.go{background:var(--green);color:#fff;border-radius:14px;padding:10px 18px;font-weight:900;font-size:16px;box-shadow:0 4px 0 #2a9c3a;white-space:nowrap}
.c1{background:var(--honey)}
.c2{background:var(--ice);color:#1f3a5c}
.c3{background:#e9d4ff;color:#3a1660}
.sync{margin:18px 0 0;text-align:center;font-weight:700;font-size:14px;color:#cfd7f5}.sync.ok{color:#8be59a}.sync.off{color:#ffb38a}
.foot{margin-top:22px;color:#8f9acb;font-size:13px;text-align:center}
#play{position:fixed;inset:0;background:#000}
#play iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
@media (prefers-reduced-motion:reduce){.cart{transition:none}}
.board{margin:26px auto 0;max-width:640px;background:rgba(255,255,255,.08);border-radius:24px;padding:18px 16px;color:#fff}
.board h2{margin:0 0 10px;font-size:24px;font-weight:900;text-align:center}
.btabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bt{min-height:44px;padding:0 16px;border-radius:999px;border:0;background:rgba(255,255,255,.15);color:#fff;font:800 15px inherit;cursor:pointer}
.bt.on{background:#ffd35a;color:#2a1a08}
.bnote{margin:10px 0 8px;text-align:center;font-size:13px;color:#cfd7f5;font-weight:700}
.blist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.blist li{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px;background:rgba(255,255,255,.1);border-radius:16px;padding:10px 14px;font-weight:800}
.blist li.me{background:rgba(255,211,90,.28);box-shadow:0 0 0 2px #ffd35a inset}
.blist .rk{font-size:20px;text-align:center}.blist .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blist .nm small{display:block;font-size:12px;color:#cfd7f5;font-weight:700}
.blist .sc{font-size:20px;font-weight:900;color:#ffd35a;font-variant-numeric:tabular-nums}
.blist .bempty{display:block;text-align:center;color:#cfd7f5}
#impDlg,#expDlg,#nameDlg{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(10,14,40,.78);padding:20px}
.ndlg{background:#fff;color:#2a1a08;border-radius:24px;padding:22px 20px;max-width:360px;width:100%;box-shadow:0 10px 0 rgba(0,0,0,.35)}
.ndlg h2{margin:0 0 6px;font-size:22px;font-weight:900}.ndlg p{margin:0 0 12px;font-weight:700;color:#5a4a36}
.ndlg input{width:100%;box-sizing:border-box;min-height:50px;border-radius:14px;border:3px solid #2a1a08;padding:0 14px;font:800 18px inherit}
.nerr{color:#d9534f!important;min-height:1.2em;margin:6px 0!important}
.nok{width:100%;min-height:52px;border-radius:14px;border:0;background:#3cba54;color:#fff;font:900 18px inherit;cursor:pointer;box-shadow:0 5px 0 #23803a}
.myname{display:block;margin:8px auto 0;min-height:40px;border-radius:999px;border:0;background:rgba(255,255,255,.15);color:#fff;font:800 14px inherit;padding:0 16px;cursor:pointer}
[hidden]{display:none!important}
#mus{width:max-content;margin:-6px auto 18px;display:flex;font:800 14px inherit;align-items:center;gap:6px;background:rgba(10,14,40,.72);border:2px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 10px 4px 4px;color:#fff}
#mus button{width:40px;height:40px;border-radius:50%;border:0;background:#ffcf4a;font-size:20px;cursor:pointer}
#mus.off button{background:#8a8fa8}
#mus input{width:84px;accent-color:#ffcf4a}
</style>
</head>
<body>
<div id="lobby">
 <div class="wrap">
  <h1>Alex的遊戲世界</h1>
  <p class="sub">選一款開始玩，遊戲裡按「‹ 大廳」就能回到這裡。進度會自動存到雲端，換手機或電腦都能接著玩。</p>
  <div id="mus"><button id="musBtn" aria-label="背景音樂開關">🎵</button><span>背景音樂</span><input id="musVol" type="range" min="0" max="100" aria-label="音樂音量"></div>
  <div class="shelf">
   <button class="cart c1" data-g="cat/index.html" aria-label="開始玩 喵喵防蜂線">
    <div class="cover"><div class="bg" id="bg1"></div><img id="i1a" alt="" style="left:8%;width:38%"><img id="i1b" alt="" style="right:10%;bottom:110px;width:26%"><img id="i1c" alt="" style="right:34%;bottom:150px;width:9%"><img id="i1d" alt="" style="right:46%;bottom:120px;width:8%"></div>
    <div class="info"><b>喵喵防蜂線</b><p>選一隻可愛寵物（貓、狗、企鵝、天竺鼠、小熊），畫線護住牠撐過蜜蜂攻擊。200 關益智解謎（101 關起是狂蜂第二部）。</p>
     <div class="meta"><span class="prog" id="p1"></span><span class="go">開始玩</span></div></div>
   </button>
   <button class="cart c2" data-g="snow/index.html" aria-label="開始玩 雪原小鎮合輯">
    <div class="cover"><div class="bg" id="bg2"></div><img id="i2a" alt="" style="left:2%;width:28%"><img id="i2b" alt="" style="left:30%;width:19%"><img id="i2c" alt="" style="left:47%;width:30%"><img id="i2d" alt="" style="right:2%;width:22%"></div>
    <div class="info"><b>雪原小鎮合輯</b><p>砍樹、獵熊、做牛排、雇工人，一站站把雪原營地經營起來；101 站起是台灣夜市篇。共 200 站。</p>
     <div class="meta"><span class="prog" id="p2"></span><span class="go">開始玩</span></div></div>
   </button>
   <button class="cart c3" data-g="bub/index.html" aria-label="開始玩 泡泡轉盤勇者">
    <div class="cover"><div class="bg" data-bg="bub/art/bg_forest.webp"></div><img loading="lazy" decoding="async" src="bub/art/hero_fox.webp" alt="" style="left:2%;width:34%"><img loading="lazy" decoding="async" src="bub/art/hero_cat.webp" alt="" style="left:33%;width:34%;bottom:24px"><img loading="lazy" decoding="async" src="bub/art/hero_archer.webp" alt="" style="right:2%;width:34%"></div>
    <div class="info"><b>泡泡轉盤勇者</b><p>轉動魔法泡泡盤、消同色泡泡，和夥伴一起放技能打倒魔物。10 個世界、200 關、20 位夥伴。</p>
     <div class="meta"><span class="prog" id="p3"></span><span class="go">開始玩</span></div></div>
   </button>
  </div>
  <section class="board" aria-label="排行榜">
   <h2>🏆 排行榜</h2>
   <div class="btabs" role="tablist"><button class="bt on" data-b="all">三款總分</button><button class="bt" data-b="cat">喵喵防蜂線</button><button class="bt" data-b="snow">雪原小鎮</button><button class="bt" data-b="bub">泡泡勇者</button></div>
   <p class="bnote" id="bnote"></p>
   <button class="myname" id="myName"></button>
   <ol class="blist" id="blist"><li class="bempty">讀取中…</li></ol>
  </section>
  <p class="sync" id="sync">雲端同步：連線中…</p>
  <button class="myname" id="impBtn">📥 匯入存檔碼</button>
  <button class="myname" id="expBtn">📦 匯出存檔碼（備份用）</button>
  <p class="foot">美術：ChatGPT　音效：ElevenLabs</p>
 </div>
</div>
<div id="expDlg" hidden><div class="ndlg"><h2>📦 你的存檔碼</h2><p>這串代碼包含三款遊戲的全部進度。已經幫你複製好了，貼到 LINE 記事本或備忘錄存著，之後搬到新網站時貼上就能接著玩。</p><textarea id="expTxt" readonly style="width:100%;height:120px;font:12px monospace;border-radius:10px;padding:8px;box-sizing:border-box;margin-bottom:10px"></textarea><button type="button" class="nok" id="expCopy">再複製一次</button> <button type="button" class="nok" id="expClose" style="background:#8a8fa8;margin-top:8px">關閉</button></div></div>
<div id="impDlg" hidden><div class="ndlg"><h2>📥 匯入存檔碼</h2><p>把之前按「匯出存檔碼」得到的代碼貼在下面。進度會跟這台裝置現有的合併，只會變多不會變少。</p><textarea id="impTxt" style="width:100%;height:120px;font:12px monospace;border-radius:10px;padding:8px;box-sizing:border-box;margin-bottom:6px"></textarea><p class="nerr" id="impErr"></p><button type="button" class="nok" id="impGo">匯入</button><button type="button" class="nok" id="impClose" style="background:#8a8fa8;margin-top:8px">取消</button></div></div>
<div id="nameDlg" hidden><form class="ndlg" id="nameForm"><h2>歡迎來到Alex的遊戲世界！</h2><p>先幫自己取個名字，排行榜上會顯示這個名字。</p>
 <input id="nameIn" maxlength="12" placeholder="輸入你的名字（1～12 字）" autocomplete="nickname" required>
 <p class="nerr" id="nameErr"></p><button type="submit" class="nok">開始玩</button></form></div>
<audio id="lbgm" loop preload="none"></audio>
<div id="play" hidden><iframe id="frame" title="遊戲" allow="autoplay; fullscreen"></iframe></div>

async function makeCode(){const o=readLocal();const raw=new TextEncoder().encode(JSON.stringify({v:1,t:Date.now(),keys:o}));
 let bytes=raw,pre='AGW1.';try{const cs=new CompressionStream('gzip');const out=await new Response(new Blob([raw]).stream().pipeThrough(cs)).arrayBuffer();bytes=new Uint8Array(out);pre='AGW1z.'}catch(e){}
 let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return pre+btoa(bin)}
async function copyTxt(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const x=$('expTxt');x.select();try{return document.execCommand('copy')}catch(_){return false}}}
$('expBtn').onclick=async()=>{const c=await makeCode();$('expTxt').value=c;$('expDlg').hidden=false;await copyTxt(c)};
async function readCode(c){c=(c||'').trim().replace(/\s+/g,'');const m=c.match(/^AGW1(z?)\.(.+)$/);if(!m)throw 0;const bin=atob(m[2]);const u=Uint8Array.from(bin,ch=>ch.charCodeAt(0));
 let txt;if(m[1]){const ds=new DecompressionStream('gzip');txt=await new Response(new Blob([u]).stream().pipeThrough(ds)).text()}else txt=new TextDecoder().decode(u);const d=JSON.parse(txt);if(!d||!d.keys)throw 0;return d.keys}

/* ===== 排行榜：每人一筆 board/<id>，大家都看得到，只能改自己的 ===== */
let myId=null,bdb=null,rows=[],bMode='all',lastBoard='',NAMES={},rbT=0;
function renderSoon(){if(rbT)return;const f=()=>{if(!rbT)return;rbT=0;renderBoard()};rbT=1;requestAnimationFrame(f);setTimeout(f,300)}
function stats(){const J2=(k,d)=>{try{const v=LS.get(k);return v?JSON.parse(v):d}catch(e){return d}};
 const st=J2('mfl_stars',{})||{},sd=J2('snow_done',{})||{};const catStars=Object.values(st).reduce((a,b)=>a+(+b||0),0),catClear=Object.keys(st).length,snow=Object.values(sd).filter(Boolean).length;
 const bs=J2('bwh_save',null)||{},bub=Object.values(bs.stars||{}).reduce((a,b)=>a+(+b||0),0);
 return{catStars,catClear,snow,bub,total:catStars+snow*3+bub}}
async function pushBoard(){if(!bdb||!myId||!cloudOK)return;/* 先等雲端存檔合併完，避免新裝置用空進度蓋掉排行榜 */
 const s0={...stats(),name:pname()},js=JSON.stringify(s0);if(js===lastBoard)return;
 try{let o={};try{const sn=await bdb.doc('board/'+myId).get();if(sn&&sn.exists)o=(typeof sn.data==='function'?sn.data():sn.data)||{}}catch(e){const r=rows.find(x=>x.id===myId);if(!r)return;o=r}
  const mx=k=>Math.max(+s0[k]||0,+o[k]||0),s={catStars:mx('catStars'),catClear:mx('catClear'),snow:mx('snow'),bub:mx('bub'),name:s0.name||o.name||''};s.total=s.catStars+s.snow*3+s.bub;
  if(!s.total&&!s.name)return;await bdb.doc('board/'+myId).set({...s,t:Date.now()});lastBoard=js}catch(e){}}
function val(r){return bMode==='cat'?r.catStars:bMode==='snow'?r.snow:bMode==='bub'?(r.bub||0):r.total}
async function renderBoard(){const L=$('blist');$('bnote').textContent=bMode==='all'?'總分 ＝ 喵喵星星 ＋ 雪原完工站數 × 3 ＋ 泡泡星星':bMode==='cat'?'依喵喵防蜂線星星總數排名（同分比過關數）':bMode==='bub'?'依泡泡轉盤勇者星星總數排名':'依雪原小鎮完工站數排名';
 const list=rows.filter(r=>val(r)>0).sort((a,b)=>val(b)-val(a)||(b.catClear||0)-(a.catClear||0)||(a.t||0)-(b.t||0)).slice(0,30);
 if(!list.length){L.innerHTML='<li class="bempty">還沒有人上榜，快去玩一局！</li>';return}
 const need=list.map(r=>r.id).filter(id=>!(id in NAMES)&&!list.find(r=>r.id===id&&r.name));if(need.length){try{const u=await claude.use('user');const got=u?await u.profiles(need)||{}:{};need.forEach(id=>NAMES[id]=got[id]||null)}catch(e){}}const names=NAMES;
 L.innerHTML='';list.forEach((r,i)=>{const li=document.createElement('li');if(r.id===myId)li.className='me';
  const rk=document.createElement('span');rk.className='rk';rk.textContent=i<3?['🥇','🥈','🥉'][i]:String(i+1);
  const nm=document.createElement('span');nm.className='nm';nm.textContent=(String(r.name||'').slice(0,12)||(names[r.id]&&names[r.id].name)||'玩家')+(r.id===myId?'（你）':'');
  const sm=document.createElement('small');sm.textContent=bMode==='cat'?`過關 ${r.catClear||0} 關`:bMode==='snow'?`喵喵 ★${r.catStars||0}`:bMode==='bub'?`雪原 ${r.snow||0} 站`:`喵喵 ★${r.catStars||0}・雪原 ${r.snow||0} 站・泡泡 ★${r.bub||0}`;nm.appendChild(sm);
  const sc=document.createElement('span');sc.className='sc';sc.textContent=bMode==='cat'||bMode==='bub'?'★'+val(r):bMode==='snow'?val(r)+' 站':val(r)+' 分';
  li.append(rk,nm,sc);L.appendChild(li)})}

async function loadBoard(){if(!FBM)return;try{const B=await fbInit();const live=await B.list('board');
  rows=[...live,...STATIC.filter(s=>!live.some(l=>l.id===nid(s.name))).map(s=>({id:nid(s.name),...s}))];renderSoon()}catch(e){}}

  rows=STATIC.map(s=>({id:nid(s.name),...s}));renderBoard();loadBoard();setInterval(loadBoard,30000);return}const tm=setTimeout(()=>{if(!rows.length)$('blist').innerHTML='<li class="bempty">排行榜暫時讀不到，請稍後再試</li>'},10000);
 try{bdb=await claude.use('db');const u=await claude.use('user');myId=u&&await u.id();if(!bdb){clearTimeout(tm);$('blist').innerHTML='<li class="bempty">登入 Claude 後才看得到排行榜</li>';return}
  bdb.collection('board').onSnapshot(q=>{clearTimeout(tm);rows=(q.docs||q||[]).map(d=>({id:d.id,...(typeof d.data==='function'?d.data():(d.data||{}))}));renderSoon()},()=>{clearTimeout(tm);$('blist').innerHTML='<li class="bempty">排行榜暫時讀不到</li>'});
  setTimeout(pushBoard,1500)}catch(e){clearTimeout(tm)}})();
